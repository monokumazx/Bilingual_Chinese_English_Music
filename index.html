        {cat:"crosstalk",ch:"相声",py:"xiàngsheng",en:"crosstalk / comic dialogue",def:"中国传统喜剧表演艺术",defEn:"traditional Chinese comedic performance art",ex:"我喜欢听相声。I love listening to crosstalk.",di:[{c:"相",e:"mutual"},{c:"声",e:"sound"}]},
        {cat:"crosstalk",ch:"单口相声",py:"dānkǒu xiàngsheng",en:"solo crosstalk",def:"一个人表演的相声",defEn:"crosstalk performed by one person",ex:"单口相声考验演员的功力。Solo crosstalk tests the performer's skills.",di:[{c:"单口",e:"single mouth"},{c:"相声",e:"crosstalk"}]},
        {cat:"crosstalk",ch:"对口相声",py:"duìkǒu xiàngsheng",en:"duo crosstalk",def:"两人配合的相声，最常见的形式",defEn:"crosstalk with two performers, the most common form",ex:"对口相声需要配合默契。Duo crosstalk requires great chemistry.",di:[{c:"对口",e:"paired mouths"},{c:"相声",e:"crosstalk"}]},
        {cat:"crosstalk",ch:"群活相声",py:"qúnhuó xiàngsheng",en:"group crosstalk",def:"三人或以上表演",defEn:"three or more performers",ex:"群活相声很热闹。Group crosstalk is lively.",di:[{c:"群活",e:"group activity"},{c:"相声",e:"crosstalk"}]},
        {cat:"crosstalk",ch:"逗哏的",py:"dòugénde",en:"lead comedian",def:"相声中的主要逗笑角色",defEn:"the main funny role",ex:"逗哏的负责抖包袱。The lead comedian delivers the punchlines.",di:[{c:"逗",e:"amuse"},{c:"哏",e:"funny"}]},
        {cat:"crosstalk",ch:"捧哏的",py:"pěnggénde",en:"straight man",def:"相声中的配合角色",defEn:"the supporting role that sets up jokes",ex:"捧哏的作用也很重要。The straight man is also important.",di:[{c:"捧",e:"support"},{c:"哏",e:"funny"}]},
        {cat:"crosstalk",ch:"说学逗唱",py:"shuō xué dòu chàng",en:"four basic skills",def:"相声演员的四大基本功",defEn:"the four fundamental skills of crosstalk",ex:"说学逗唱是相声的基础。These four are the foundation.",di:[{c:"说",e:"speak"},{c:"学",e:"imitate"},{c:"逗",e:"joke"},{c:"唱",e:"sing"}]},
        {cat:"crosstalk",ch:"贯口",py:"guànkǒu",en:"rapid-fire monologue",def:"一口气快速说完大段台词",defEn:"delivering a long monologue rapidly in one breath",ex:"这段贯口考验嘴皮子功夫。This monologue tests verbal skills.",di:[{c:"贯",e:"continuously"},{c:"口",e:"mouth"}]},
        {cat:"crosstalk",ch:"垫话",py:"diànhuà",en:"opening joke / warm-up",def:"相声开场的铺垫说笑",defEn:"opening banter to warm up the audience",ex:"垫话是为了活跃气氛。The warm-up livened the atmosphere.",di:[{c:"垫",e:"cushion"},{c:"话",e:"speech"}]},
        {cat:"crosstalk",ch:"包袱",py:"bāofu",en:"punchline / comedic payoff",def:"相声中的笑料",defEn:"the joke or comedic payoff",ex:"这个包袱抖得很响。This punchline got a big laugh.",di:[{c:"包",e:"wrap"},{c:"袱",e:"cloth"}]},

        // ========== 🎼 音乐理论 / Music Theory ==========
        {cat:"theory",ch:"五线谱",py:"wǔxiànpǔ",en:"staff / stave",def:"记录音乐的五条平行线",defEn:"five parallel lines for writing music",ex:"学习五线谱是音乐的基础。Learning the staff is foundational.",di:[{c:"五",e:"five"},{c:"线",e:"line"},{c:"谱",e:"score"}]},
        {cat:"theory",ch:"高音谱号",py:"gāoyīn pǔhào",en:"treble clef / G clef",def:"标记高音区的谱号",defEn:"clef marking the higher pitch range",ex:"高音谱号又叫G谱号。Treble clef is also called G clef.",di:[{c:"高音",e:"high pitch"},{c:"谱号",e:"clef"}]},
        {cat:"theory",ch:"低音谱号",py:"dīyīn pǔhào",en:"bass clef / F clef",def:"标记低音区的谱号",defEn:"clef marking the lower pitch range",ex:"低音谱号又叫F谱号。Bass clef is also called F clef.",di:[{c:"低音",e:"low pitch"},{c:"谱号",e:"clef"}]},
        {cat:"theory",ch:"音符",py:"yīnfú",en:"note",def:"表示音高和时值的符号",defEn:"symbol representing pitch and duration",ex:"每个音符都有特定的时值。Each note has a specific duration.",di:[{c:"音",e:"sound"},{c:"符",e:"symbol"}]},
        {cat:"theory",ch:"全音符",py:"quányīnfú",en:"whole note / semibreve",def:"时值最长的基本音符",defEn:"basic note with the longest duration",ex:"全音符持续四拍。A whole note lasts four beats.",di:[{c:"全",e:"whole"},{c:"音符",e:"note"}]},
        {cat:"theory",ch:"二分音符",py:"èrfēn yīnfú",en:"half note",def:"全音符一半时值",defEn:"half the duration of a whole note",ex:"二分音符持续两拍。A half note lasts two beats.",di:[{c:"二分",e:"half"},{c:"音符",e:"note"}]},
        {cat:"theory",ch:"四分音符",py:"sìfēn yīnfú",en:"quarter note",def:"一拍一个的音符",defEn:"one beat per note",ex:"四分音符是最常见的节奏单位。Quarter notes are the most common.",di:[{c:"四分",e:"quarter"},{c:"音符",e:"note"}]},
        {cat:"theory",ch:"八分音符",py:"bāfēn yīnfú",en:"eighth note",def:"半拍一个的音符",defEn:"half-beat note",ex:"八分音符比四分音符快一倍。Eighth notes are twice as fast.",di:[{c:"八分",e:"eighth"},{c:"音符",e:"note"}]},
        {cat:"theory",ch:"节奏",py:"jiézòu",en:"rhythm",def:"音乐中长短音的组织",defEn:"organization of long and short sounds",ex:"这首歌的节奏感很强。This song has a strong rhythm.",di:[{c:"节",e:"beat"},{c:"奏",e:"play"}]},
        {cat:"theory",ch:"旋律",py:"xuánlǜ",en:"melody",def:"音乐的主线条",defEn:"the main line of music",ex:"这段旋律很优美。This melody is beautiful.",di:[{c:"旋",e:"spin"},{c:"律",e:"law"}]},
        {cat:"theory",ch:"和声",py:"héshēng",en:"harmony",def:"多个音同时发声",defEn:"multiple sounds played simultaneously",ex:"和声让音乐更丰富。Harmony enriches music.",di:[{c:"和",e:"together"},{c:"声",e:"sound"}]},
        {cat:"theory",ch:"音阶",py:"yīnjiē",en:"scale",def:"按高低顺序排列的一组音",defEn:"a set of notes arranged in order",ex:"C大调音阶是最基本的音阶。The C major scale is the most basic.",di:[{c:"音",e:"sound"},{c:"阶",e:"ladder"}]},
        {cat:"theory",ch:"调号",py:"diàohào",en:"key signature",def:"标记乐曲调性的符号",defEn:"symbols marking the key of a piece",ex:"调号告诉你哪些音要升或降。The key signature shows which notes to alter.",di:[{c:"调",e:"key"},{c:"号",e:"sign"}]},
        {cat:"theory",ch:"升号",py:"shēnghào",en:"sharp",def:"升高半音",defEn:"raises a note by a semitone",ex:"升号让音符升高半音。A sharp raises the note.",di:[{c:"升",e:"raise"},{c:"号",e:"sign"}]},
        {cat:"theory",ch:"降号",py:"jiànghào",en:"flat",def:"降低半音",defEn:"lowers a note by a semitone",ex:"降号让音符降低半音。A flat lowers the note.",di:[{c:"降",e:"lower"},{c:"号",e:"sign"}]},
        {cat:"theory",ch:"和弦",py:"héxián",en:"chord",def:"三个或以上音同时发声",defEn:"three or more notes played together",ex:"C和弦由C、E、G组成。The C chord consists of C, E, and G.",di:[{c:"和",e:"together"},{c:"弦",e:"string"}]},
        {cat:"theory",ch:"音程",py:"yīnchéng",en:"interval",def:"两个音之间的高低距离",defEn:"the pitch distance between two notes",ex:"C到G的音程是五度。The interval from C to G is a fifth.",di:[{c:"音",e:"sound"},{c:"程",e:"distance"}]},
        {cat:"theory",ch:"调性",py:"diàoxìng",en:"tonality",def:"音乐以某个音为中心的属性",defEn:"the property of music centered around a particular note",ex:"这首曲子是C大调的调性。This piece is in the key of C major.",di:[{c:"调",e:"key"},{c:"性",e:"nature"}]},

        // ========== 🎻 乐器家族 / Instrument Families ==========
        {cat:"instrument-families",ch:"乐器家族",py:"yuèqì jiāzú",en:"instrument families",def:"根据发声方式和结构对乐器进行的分类",defEn:"classification of instruments based on sound production and structure",ex:"交响乐团包含四大乐器家族。The symphony orchestra contains four instrument families.",di:[{c:"乐器",e:"instrument"},{c:"家族",e:"family"}],note:"四大乐器家族：弦乐、木管、铜管、打击乐。Four main families: strings, woodwinds, brass, percussion."},
        {cat:"instrument-families",ch:"弦乐",py:"xiányuè",en:"strings",def:"通过弦的振动产生声音的乐器家族",defEn:"instruments with strings that produce sound through vibration",ex:"弦乐家族包括小提琴、大提琴等。The string family includes violin, cello, etc.",di:[{c:"弦",e:"string"},{c:"乐",e:"music"}],note:"发声方式：弹奏(plucking)、拉弦(bowing)、击弦(hitting)。"},
        {cat:"instrument-families",ch:"弦乐器",py:"xiányuèqì",en:"string instruments",def:"以弦振动发声的乐器总称",defEn:"general term for instruments producing sound via vibrating strings",ex:"小提琴是弦乐器的代表。The violin represents string instruments.",di:[{c:"弦",e:"string"},{c:"乐器",e:"instrument"}]},
        {cat:"instrument-families",ch:"木管乐器",py:"mùguǎn yuèqì",en:"woodwinds",def:"通过管内空气振动产生声音的乐器",defEn:"instruments where sound is produced by vibrating air within a tube",ex:"长笛和单簧管都属于木管乐器。Flute and clarinet are both woodwinds.",di:[{c:"木",e:"wood"},{c:"管",e:"tube"},{c:"乐器",e:"instrument"}],note:"发声：吹口簧、吹缝隙、吹双簧。Sound: blowing across edge, single reed, or double reed."},
        {cat:"instrument-families",ch:"铜管乐器",py:"tóngguǎn yuèqì",en:"brass",def:"通过吹口振动嘴唇产生声音的乐器",defEn:"instruments producing sound by vibrating lips in a mouthpiece",ex:"小号和长号都是铜管乐器。Trumpet and trombone are brass instruments.",di:[{c:"铜",e:"brass/copper"},{c:"管",e:"tube"},{c:"乐器",e:"instrument"}],note:"发声方式：嘴唇在吹口中振动。Sound: lips vibrate in mouthpiece."},
        {cat:"instrument-families",ch:"打击乐器",py:"dǎjī yuèqì",en:"percussion",def:"通过击打或使膜或实体材料振动产生声音",defEn:"instruments producing sound by striking or causing vibration in a membrane or solid material",ex:"鼓是打击乐器中最常见的。Drums are the most common percussion instruments.",di:[{c:"打击",e:"strike"},{c:"乐器",e:"instrument"}],note:"发声：敲击(hitting)、摇动(shaking)、摩擦(rubbing)等。"},
        {cat:"instrument-families",ch:"键盘乐器",py:"jiànpán yuèqì",en:"keyboard instruments",def:"通过键盘触发声音的乐器",defEn:"instruments where sound is triggered by a keyboard",ex:"钢琴是最典型的键盘乐器。Piano is the most typical keyboard instrument.",di:[{c:"键盘",e:"keyboard"},{c:"乐器",e:"instrument"}],note:"包括钢琴、风琴、羽管键琴等。Includes piano, organ, harpsichord, etc."},
        {cat:"instrument-families",ch:"弹拨乐器",py:"tánbō yuèqì",en:"plucked instruments",def:"用手指或拨子拨动琴弦发声的乐器",defEn:"instruments sounded by plucking strings with fingers or a plectrum",ex:"吉他和琵琶都是弹拨乐器。Guitar and pipa are both plucked instruments.",di:[{c:"弹拨",e:"pluck"},{c:"乐器",e:"instrument"}]},
        {cat:"instrument-families",ch:"拉弦乐器",py:"lāxián yuèqì",en:"bowed instruments",def:"用弓摩擦琴弦发声的乐器",defEn:"instruments sounded by drawing a bow across strings",ex:"二胡和小提琴都是拉弦乐器。Erhu and violin are both bowed instruments.",di:[{c:"拉",e:"pull/draw"},{c:"弦",e:"string"},{c:"乐器",e:"instrument"}]},
        {cat:"instrument-families",ch:"吹管乐器",py:"chuīguǎn yuèqì",en:"wind instruments",def:"通过吹气使管内空气振动发声",defEn:"instruments sounded by blowing air through a tube",ex:"笛子和箫都是吹管乐器。Dizi and xiao are both wind instruments.",di:[{c:"吹",e:"blow"},{c:"管",e:"tube"},{c:"乐器",e:"instrument"}]},
        {cat:"instrument-families",ch:"电子乐器",py:"diànzǐ yuèqì",en:"electronic instruments",def:"通过电子电路产生或处理声音的乐器",defEn:"instruments that produce or process sound via electronic circuits",ex:"合成器是常见的电子乐器。Synthesizers are common electronic instruments.",di:[{c:"电子",e:"electronic"},{c:"乐器",e:"instrument"}]},
        {cat:"instrument-families",ch:"交响乐团",py:"jiāoxiǎng yuètuán",en:"symphony orchestra",def:"包含弦乐、木管、铜管、打击乐四大乐器家族的大型乐团",defEn:"large ensemble containing all four instrument families: strings, woodwinds, brass, percussion",ex:"交响乐团通常有近百人。A symphony orchestra usually has nearly 100 musicians.",di:[{c:"交响",e:"symphony"},{c:"乐团",e:"orchestra"}],note:"四大乐器家族：弦乐(strings)、木管(woodwinds)、铜管(brass)、打击乐(percussion)。"},

        // ========== 🪕 中国乐器 / Chinese Instruments ==========
        {cat:"instruments-chinese",ch:"琴",py:"qín",en:"qin / guqin",def:"中国最古老的弹拨乐器，原只称琴",defEn:"the oldest Chinese plucked instrument, originally just called qin",ex:"古人以琴棋书画为修身之艺。The ancients cultivated themselves with qin, chess, calligraphy, and painting.",di:[{c:"琴",e:"qin"}],note:"古代独称琴，后因钢琴传入加古字以区分。Originally just called 琴; 古 was added to distinguish from piano."},
        {cat:"instruments-chinese",ch:"古琴",py:"gǔqín",en:"guqin",def:"七弦的中国传统拨弦乐器，有3000年以上历史",defEn:"seven-stringed traditional Chinese plucked instrument, over 3000 years old",ex:"古琴的声音深沉悠远。The guqin's sound is deep and resonant.",di:[{c:"古",e:"ancient"},{c:"琴",e:"qin"}],note:"原只称琴，钢琴传入后加古字以区分。Originally only called 琴; 古 added after piano's introduction."},
        {cat:"instruments-chinese",ch:"古筝",py:"gǔzhēng",en:"guzheng",def:"21弦的中国传统弹拨乐器",defEn:"21-stringed traditional Chinese plucked instrument",ex:"古筝的音色典雅优美。The guzheng has an elegant tone.",di:[{c:"古",e:"ancient"},{c:"筝",e:"zither"}]},
        {cat:"instruments-chinese",ch:"琵琶",py:"pípá",en:"pipa",def:"四弦的中国弹拨乐器，梨形琴身",defEn:"four-stringed Chinese plucked instrument, pear-shaped body",ex:"琵琶的演奏技巧非常丰富。The pipa has rich playing techniques.",di:[{c:"琵琶",e:"pipa"}]},
        {cat:"instruments-chinese",ch:"三弦",py:"sānxián",en:"sanxian",def:"三根弦的中国弹拨乐器",defEn:"three-stringed Chinese plucked instrument",ex:"三弦的音色很有特色。The sanxian has a distinctive sound.",di:[{c:"三",e:"three"},{c:"弦",e:"string"}]},
        {cat:"instruments-chinese",ch:"阮",py:"ruǎn",en:"ruan / moon lute",def:"圆形音箱的四弦弹拨乐器",defEn:"four-stringed plucked instrument with a round sound box",ex:"阮的声音温厚圆润。The ruan has a warm, round tone.",di:[{c:"阮",e:"ruan"}],note:"以魏晋名士阮咸命名。Named after Ruan Xian, a famous scholar of the Wei-Jin period."},
        {cat:"instruments-chinese",ch:"月琴",py:"yuèqín",en:"yueqin / moon guitar",def:"圆形琴身的弹拨乐器",defEn:"plucked instrument with a round body",ex:"月琴在京剧中常用。The yueqin is commonly used in Beijing opera.",di:[{c:"月",e:"moon"},{c:"琴",e:"instrument"}]},
        {cat:"instruments-chinese",ch:"柳琴",py:"liǔqín",en:"liuqin / willow lute",def:"形似柳叶的小型弹拨乐器",defEn:"small plucked instrument shaped like a willow leaf",ex:"柳琴的声音清脆明亮。The liuqin has a crisp, bright sound.",di:[{c:"柳",e:"willow"},{c:"琴",e:"instrument"}]},
        {cat:"instruments-chinese",ch:"瑟",py:"sè",en:"se",def:"古代大型弹拨乐器，25弦",defEn:"ancient large plucked instrument with 25 strings",ex:"琴瑟和鸣比喻夫妻和睦。Qin and se in harmony symbolizes marital bliss.",di:[{c:"瑟",e:"se zither"}],note:"古代与琴合称琴瑟。Ancient texts pair 琴 and 瑟 together."},
        {cat:"instruments-chinese",ch:"箜篌",py:"kōnghóu",en:"konghou / Chinese harp",def:"中国古代竖琴类乐器",defEn:"ancient Chinese harp-like instrument",ex:"箜篌的声音空灵优美。The konghou sounds ethereal and beautiful.",di:[{c:"箜篌",e:"harp"}]},
        {cat:"instruments-chinese",ch:"筑",py:"zhù",en:"zhu",def:"中国古代击弦乐器，已失传",defEn:"ancient Chinese struck string instrument, now lost",ex:"史记中记载了筑这种乐器。The zhu is recorded in the Historical Records.",di:[{c:"筑",e:"zhu instrument"}],note:"已失传的古代乐器。An ancient instrument that has been lost to history."},
        {cat:"instruments-chinese",ch:"二胡",py:"èrhú",en:"erhu",def:"两根弦的中国拉弦乐器",defEn:"two-stringed Chinese bowed instrument",ex:"二胡的声音如泣如诉。The erhu sounds like singing and crying.",di:[{c:"二",e:"two"},{c:"胡",e:"barbarian"}]},
        {cat:"instruments-chinese",ch:"笛子",py:"dízi",en:"dizi / bamboo flute",def:"中国横吹竹管乐器",defEn:"Chinese transverse bamboo flute",ex:"笛子的声音悠扬悦耳。The dizi has a melodious sound.",di:[{c:"笛",e:"flute"},{c:"子",e:"suffix"}]},
        {cat:"instruments-chinese",ch:"箫",py:"xiāo",en:"xiao / vertical bamboo flute",def:"中国竖吹竹管乐器",defEn:"Chinese vertical bamboo flute",ex:"箫声悠远空灵。The xiao sounds distant and ethereal.",di:[{c:"箫",e:"xiao flute"}]},
        {cat:"instruments-chinese",ch:"排箫",py:"páixiāo",en:"panpipes",def:"多根竹管排列的吹奏乐器",defEn:"multiple bamboo tubes arranged for blowing",ex:"排箫的声音空灵悦耳。Panpipes sound ethereal and pleasant.",di:[{c:"排",e:"row"},{c:"箫",e:"flute"}]},
        {cat:"instruments-chinese",ch:"笙",py:"shēng",en:"sheng / reed pipe",def:"中国簧管乐器，可同时吹多个音",defEn:"Chinese reed instrument, can play multiple notes simultaneously",ex:"笙是唯一能演奏和声的中国管乐器。Sheng is the only Chinese wind instrument that can play chords.",di:[{c:"笙",e:"sheng pipe"}]},
        {cat:"instruments-chinese",ch:"埙",py:"xūn",en:"xun / clay ocarina",def:"中国最古老的吹奏乐器，陶土制成",defEn:"the oldest Chinese wind instrument, made of clay",ex:"埙的声音古朴苍凉。The xun has an ancient, desolate sound.",di:[{c:"埙",e:"clay ocarina"}],note:"已有7000多年历史。Has over 7,000 years of history."},
        {cat:"instruments-chinese",ch:"唢呐",py:"suǒnà",en:"suona / Chinese oboe",def:"中国双簧吹管乐器，声音高亢嘹亮",defEn:"Chinese double-reed wind instrument with a powerful, piercing sound",ex:"唢呐一响，不是大喜就是大悲。When the suona plays, it's either great joy or great sorrow.",di:[{c:"唢呐",e:"suona"}]},
        {cat:"instruments-chinese",ch:"编钟",py:"biānzhōng",en:"bianzhong / bronze bells",def:"中国古代大型打击乐器，青铜铸造",defEn:"ancient Chinese large percussion instrument, cast in bronze",ex:"曾侯乙编钟是国宝级文物。The Marquis Yi's bianzhong is a national treasure.",di:[{c:"编",e:"arranged"},{c:"钟",e:"bell"}],note:"战国时期的大型宫廷乐器。Large court instrument from the Warring States period."},
        {cat:"instruments-chinese",ch:"编磬",py:"biānqìng",en:"bianqing / stone chimes",def:"石制的古代打击乐器",defEn:"ancient percussion instrument made of stone",ex:"编磬常与编钟合奏。Bianqing is often played with bianzhong.",di:[{c:"编",e:"arranged"},{c:"磬",e:"stone chime"}]},
        {cat:"instruments-chinese",ch:"锣",py:"luó",en:"gong / luo",def:"铜制圆形打击乐器",defEn:"round bronze percussion instrument",ex:"锣声一响，好戏开场。When the gong sounds, the show begins.",di:[{c:"锣",e:"gong"}]},
        {cat:"instruments-chinese",ch:"钹",py:"bó",en:"cymbals / bo",def:"成对使用的铜制打击乐器",defEn:"paired bronze percussion instruments",ex:"钹的声音清脆响亮。The cymbals are crisp and loud.",di:[{c:"钹",e:"cymbals"}]},

        {cat:"industry",ch:"排行榜",py:"páihángbǎng",en:"music chart",def:"根据受欢迎程度排名的榜单",defEn:"ranking list based on popularity",ex:"这首歌登上了排行榜第一名。This song topped the charts.",di:[{c:"排行",e:"ranking"},{c:"榜",e:"list"}]},
        {cat:"industry",ch:"版权",py:"bǎnquán",en:"copyright",def:"对作品拥有的法律权利",defEn:"legal rights to a work",ex:"音乐版权保护创作者的利益。Music copyright protects creators.",di:[{c:"版",e:"edition"},{c:"权",e:"right"}]},

        // ========== 📝 音乐创作 / Composition ==========
        {cat:"composition",ch:"作曲",py:"zuòqǔ",en:"compose",def:"创作音乐曲调",defEn:"creating musical tunes",ex:"他花了一个月来作曲。He spent a month composing.",di:[{c:"作",e:"create"},{c:"曲",e:"tune"}]},
        {cat:"composition",ch:"填词",py:"tiáncí",en:"write lyrics",def:"为歌曲创作歌词",defEn:"writing lyrics for a song",ex:"她为这首歌填了词。She wrote the lyrics for this song.",di:[{c:"填",e:"fill"},{c:"词",e:"words"}]},
        {cat:"composition",ch:"编曲",py:"biānqǔ",en:"arrange",def:"为乐曲编排配器",defEn:"arranging instrumentation",ex:"编曲让这首歌更加丰富。The arrangement enriched the song.",di:[{c:"编",e:"arrange"},{c:"曲",e:"music"}]},
        {cat:"composition",ch:"混音",py:"hùnyīn",en:"mixing",def:"将多个音轨混合平衡",defEn:"balancing multiple audio tracks",ex:"混音师让所有乐器听起来协调。The mixer balances all instruments.",di:[{c:"混",e:"mix"},{c:"音",e:"sound"}]},
        {cat:"composition",ch:"即兴",py:"jíxìng",en:"improvisation",def:"不经准备当场创作演奏",defEn:"creating and performing on the spot",ex:"爵士乐手擅长即兴演奏。Jazz musicians excel at improvisation.",di:[{c:"即",e:"immediate"},{c:"兴",e:"inspiration"}]}
    ];

    var catLabels = {
        "all":"🎵 全部音乐 / All Music",
        "performing":"🎭 表演艺术 / Performing Arts",
        "crosstalk":"🎙️ 相声 / Crosstalk",
        "theory":"🎼 音乐理论 / Music Theory",
        "instrument-families":"🎻 乐器家族 / Instrument Families",
        "instruments-chinese":"🪕 中国乐器 / Chinese Instruments",
        "instruments-western":"🎻 西洋乐器 / Western Instruments",
        "vocal":"🎤 声乐 / Vocal Music",
        "genres":"🎧 音乐类型 / Music Genres",
        "professionals":"👥 音乐人 / Music Professionals",
        "stage":"🎬 表演舞台 / Performance & Stage",
        "industry":"💿 音乐产业 / Music Industry",
        "composition":"📝 音乐创作 / Composition"
    };

    var categoryImages = {
        "all":"images/music-all.png","performing":"images/music-performing.png",
        "crosstalk":"images/music-crosstalk.png","theory":"images/music-theory.png",
        "instrument-families":"images/music-instrument-families.png",
        "instruments-chinese":"images/music-instruments-chinese.png",
        "instruments-western":"images/music-instruments-western.png",
        "vocal":"images/music-vocal.png","genres":"images/music-genres.png",
        "professionals":"images/music-professionals.png","stage":"images/music-stage.png",
        "industry":"images/music-industry.png","composition":"images/music-composition.png"
    };

    var tbl=document.getElementById('dynamicTableContainer');
    var gal=document.getElementById('puzzleGallery');
    var imageSlot=document.getElementById('categoryImageSlot');
    var imageLabel=document.getElementById('imageLabel');

    function updateCategoryImage(cat) {
        var imagePath = categoryImages[cat];
        var label = catLabels[cat] || cat;
        if (imagePath) {
            var img = document.createElement('img');
            img.src = imagePath; img.alt = label;
            img.style.maxWidth = '100%'; img.style.maxHeight = '350px';
            img.style.borderRadius = '1.5rem'; img.style.objectFit = 'contain';
            img.onerror = function() {
                imageSlot.innerHTML = '<span>🖼️ ' + label + ' — 图片未找到<br><small>Path: ' + imagePath + '</small></span>';
            };
            imageSlot.innerHTML = ''; imageSlot.appendChild(img);
        } else {
            imageSlot.innerHTML = '<span>🖼️ ' + label + ' — 图片位置 (PNG)</span>';
        }
        if(imageLabel) imageLabel.textContent = label;
    }

    function buildDiss(di,full){
        if(!di||!di.length)return'';
        var cn='<div class="dissect-line">🧩 中文：';
        di.forEach(function(p,i){
            if(i>0)cn+='<span class="plus-sign"> + </span>';
            cn+='<span class="char-piece">'+p.c+' <small>('+(cnMap[p.c]||p.c)+')</small></span>';
        });
        cn+='<span class="arrow-sign"> = </span><span class="result-word">'+full+'</span></div>';
        var en='<div class="dissect-line en-line">🔤 English: ';
        di.forEach(function(p,i){
            if(i>0)en+=' + ';
            en+='<strong>'+p.c+'</strong> ('+p.e+')';
        });
        en+=' = <strong>'+full+'</strong></div>';
        return '<div class="puzzle-box">'+cn+en+'</div>';
    }

    function render(cat){
        var f=cat==='all'?dataset:dataset.filter(function(d){return d.cat===cat;});
        if(!f.length){tbl.innerHTML='<p style="padding:2rem;">✨ 暂无数据 / No items yet</p>';return;}
        var h='<div class="table-wrapper"><table><thead><tr><th>中文 & Pinyin</th><th>English</th><th>定义 / Definition & 例句</th></tr></thead><tbody>';
        f.forEach(function(item){
            h+='<tr><td class="chinese-cell">'+item.ch+'<span class="pinyin-sm">'+item.py+'</span></td><td class="english-name">'+item.en+'</td><td><span style="font-weight:600;">'+item.def+'</span><br><span style="color:#6b5080;">'+item.defEn+'</span><br><span class="example-text">📝 '+item.ex+'</span>'+(item.note?'<br><span class="note-text">💡 '+item.note+'</span>':'')+'</td></tr>';
            if(item.di&&item.di.length)h+='<tr style="background:#f8f0ff;"><td colspan="3">'+buildDiss(item.di,item.ch)+'</td></tr>';
        });
        h+='</tbody></table></div>';tbl.innerHTML=h;
    }

    function renderGal(){
        var ex=dataset.filter(function(d){return d.di&&d.di.length>=2;}).slice(0,12);
        var h='';ex.forEach(function(item){h+='<div style="background:#f8f4fc;padding:0.6rem 1rem;border-radius:1.2rem;margin-bottom:0.4rem;">'+buildDiss(item.di,item.ch)+'</div>';});
        gal.innerHTML=h||'<p>🔍 拆解更多词汇可见上方表格。</p>';
    }

    document.querySelectorAll('.cat-btn').forEach(function(btn){
        btn.addEventListener('click',function(e){
            document.querySelectorAll('.cat-btn').forEach(function(b){b.classList.remove('active');});
            e.currentTarget.classList.add('active');
            var cat=e.currentTarget.dataset.category;
            updateCategoryImage(cat); render(cat);
        });
    });

    updateCategoryImage('all'); render('all'); renderGal();
})();
</script>
</body>
</html>
